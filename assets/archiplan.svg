<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'Liberation Mono',monospace">
  <title>The archiplan loop: harden the architecture through stress rounds, seal the surviving version, execute a plan in waves, ship — and let production pressure re-enter the loop.</title>
  <style>
    :root {
      --sheet: #FBFAF6;  --plate: #E4E1D7;
      --ink: #29303B;    --muted: #6C7482;  --hair: #D8D5CB;
      --boxfill: #F4F2EB;
      --steel: #5B7395;  --steelfill: #EDF1F7;
      --ember: #BE4E28;  --emberfill: #F9ECE4;
      --brass: #A67C33;  --sealfill: #F7F1E2;
      --moss: #3E7A5E;   --mossfill: #35684F; --mosstext: #EDF5F0;
      --planfill: #F2F0E8; --chipfill: #E8EDF4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sheet: #10151D;  --plate: #232B37;
        --ink: #D9DFE8;    --muted: #8D96A4;  --hair: #29323F;
        --boxfill: #171E28;
        --steel: #7E9CC4;  --steelfill: #1B2634;
        --ember: #E06B41;  --emberfill: #2C1C13;
        --brass: #C9A052;  --sealfill: #251F12;
        --moss: #69AE8B;   --mossfill: #2C5843; --mosstext: #E7F2EC;
        --planfill: #141B25; --chipfill: #1F2B3B;
      }
    }
    .plate   { fill: var(--sheet); stroke: var(--plate); stroke-width: 1.5; }
    .hair    { stroke: var(--hair); stroke-width: 1; }
    .box     { fill: var(--boxfill); stroke: var(--ink); stroke-width: 1.1; }
    .arch1   { fill: var(--steelfill); stroke: var(--steel); stroke-width: 1.1; }
    .arch2   { fill: var(--steelfill); stroke: var(--steel); stroke-width: 1.8; }
    .sealbox { fill: var(--sealfill); stroke: var(--brass); stroke-width: 1.6; }
    .sealin  { fill: none; stroke: var(--brass); stroke-width: 0.8; opacity: 0.75; }
    .stress  { fill: var(--emberfill); stroke: var(--ember); stroke-width: 1.4; }
    .stressR { fill: var(--emberfill); stroke: var(--ember); stroke-width: 2.1; }
    .plan    { fill: var(--planfill); stroke: var(--ink); stroke-width: 1.1; }
    .chip    { fill: var(--chipfill); stroke: var(--steel); stroke-width: 0.9; }
    .codebox { fill: var(--boxfill); stroke: var(--moss); stroke-width: 1.5; }
    .prod    { fill: var(--mossfill); stroke: var(--moss); stroke-width: 1.2; }
    .e-ref   { fill: none; stroke: var(--ink);   stroke-width: 1.4; }
    .e-pin   { fill: none; stroke: var(--ink);   stroke-width: 1.5; }
    .e-press { fill: none; stroke: var(--ember); stroke-width: 1.7; }
    .e-ans   { fill: none; stroke: var(--ember); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .e-ret   { fill: none; stroke: var(--ember); stroke-width: 2.2; }
    .mk-ink   { fill: var(--ink); }
    .mk-ember { fill: var(--ember); }
    text { fill: var(--ink); }
    .t-box  { font-size: 15px; font-weight: 500; }
    .t-bold { font-size: 15px; font-weight: 650; }
    .t-chip { font-size: 13.5px; }
    .t-prod { font-size: 15px; font-weight: 600; fill: var(--mosstext); }
    .lbl    { font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-style: italic;
              font-size: 12px; fill: var(--muted);
              paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
    .lbl-e  { fill: var(--ember); }
    .cap    { font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-style: italic;
              font-size: 11px; fill: var(--muted);
              paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
    .phase  { font-size: 11px; letter-spacing: 0.12em; fill: var(--muted); }
    .phase .n { font-weight: 700; fill: var(--ink); }
    .legend { font-size: 11px; fill: var(--muted); }
    .tb     { font-size: 11px; letter-spacing: 0.06em; fill: var(--muted); }
    .tb .hi { fill: var(--ink); font-weight: 600; }
    .tb .br { fill: var(--brass); font-weight: 600; }
    .wordmark { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
    .subtitle { font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-style: italic;
                font-size: 12.5px; fill: var(--muted); }
    .thesis   { font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-style: italic;
                font-size: 12.5px; fill: var(--muted); }
    .brassmark { stroke: var(--brass); fill: none; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 8 7" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L8 3.5 L0 7 Z" class="mk-ink"/>
    </marker>
    <marker id="ah-ember" viewBox="0 0 8 7" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L8 3.5 L0 7 Z" class="mk-ember"/>
    </marker>
  </defs>

  <!-- sheet -->
  <rect x="8" y="8" width="1184" height="624" rx="16" class="plate"/>

  <!-- header -->
  <text x="56" y="64" class="wordmark">archiplan</text>
  <text x="164" y="63" class="subtitle">software hardening environment</text>
  <rect x="880" y="38" width="264" height="50" rx="6" fill="none" class="hair"/>
  <line x1="880" y1="63" x2="1144" y2="63" class="hair"/>
  <text x="894" y="55.5" class="tb">DWG — THE ARCHIPLAN LOOP</text>
  <text x="894" y="80.5" class="tb"><tspan class="hi">REV vN</tspan> · SEALED <tspan class="br">sha256 ✓</tspan></text>

  <!-- ═══ I · HARDEN ═══ -->
  <text x="56" y="91" class="phase"><tspan class="n">I — HARDEN</tspan>  ·  UNTIL A ROUND SURVIVES</text>

  <!-- round 1 -->
  <rect x="56"  y="104" width="180" height="48" rx="9" class="box"/>
  <text x="146" y="133" text-anchor="middle" class="t-box">requirements</text>
  <rect x="316" y="104" width="200" height="48" rx="9" class="arch1"/>
  <text x="416" y="133" text-anchor="middle" class="t-box">architecture v1</text>
  <rect x="596" y="104" width="180" height="48" rx="2" class="stress"/>
  <text x="686" y="133" text-anchor="middle" class="t-box">stressors</text>

  <!-- round 2 -->
  <rect x="56"  y="192" width="180" height="48" rx="9" class="box"/>
  <text x="146" y="221" text-anchor="middle" class="t-box">requirements′</text>
  <rect x="316" y="192" width="200" height="48" rx="9" class="arch2"/>
  <text x="416" y="221" text-anchor="middle" class="t-box">architecture v2</text>
  <rect x="596" y="192" width="180" height="48" rx="2" class="stress"/>
  <text x="686" y="221" text-anchor="middle" class="t-box">stressors′</text>

  <!-- round N : the seal -->
  <rect x="56"  y="280" width="180" height="48" rx="9" class="box"/>
  <text x="146" y="309" text-anchor="middle" class="t-box">requirements″</text>
  <rect x="316" y="280" width="200" height="48" rx="10" class="sealbox"/>
  <rect x="319.5" y="283.5" width="193" height="41" rx="7" class="sealin"/>
  <text x="400" y="309" text-anchor="middle" class="t-bold">architecture vN</text>
  <circle cx="489" cy="304" r="13" class="brassmark" stroke-width="1.5"/>
  <circle cx="489" cy="304" r="9.5" class="brassmark" stroke-width="1" stroke-dasharray="2.2 3.1"/>
  <path d="M 485 304.5 L 487.8 307.5 L 493.4 300.5" class="brassmark" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="596" y="280" width="180" height="48" rx="2" class="stressR"/>
  <text x="686" y="309" text-anchor="middle" class="t-bold">stressors (real)</text>

  <text x="404" y="347" text-anchor="end" class="cap">the round that survived</text>
  <text x="686" y="347" text-anchor="middle" class="cap">pressure from production</text>

  <!-- row arrows: architecture satisfies requirements · stressors press the model -->
  <path d="M 316 128 L 243 128" class="e-ref" marker-end="url(#ah-ink)"/>
  <path d="M 316 216 L 243 216" class="e-ref" marker-end="url(#ah-ink)"/>
  <path d="M 316 304 L 243 304" class="e-ref" marker-end="url(#ah-ink)"/>
  <text x="279" y="117" text-anchor="middle" class="lbl">satisfies</text>
  <path d="M 596 128 L 523 128" class="e-press" marker-end="url(#ah-ember)"/>
  <path d="M 596 216 L 523 216" class="e-press" marker-end="url(#ah-ember)"/>
  <path d="M 596 304 L 523 304" class="e-press" marker-end="url(#ah-ember)"/>
  <text x="559" y="117" text-anchor="middle" class="lbl lbl-e">press</text>

  <!-- answers: the next round's requirements answer what broke -->
  <path d="M 210 192 C 320 170, 520 174, 654 156" class="e-ans" marker-end="url(#ah-ember)"/>
  <path d="M 210 280 C 320 258, 520 262, 654 244" class="e-ans" marker-end="url(#ah-ember)"/>
  <text x="432" y="178" text-anchor="middle" class="lbl lbl-e">answers what broke</text>

  <!-- ═══ II · EXECUTE ═══ -->
  <text x="56" y="391" class="phase"><tspan class="n">II — EXECUTE</tspan>  ·  AGAINST THE PINNED SPEC</text>

  <rect x="316" y="404" width="200" height="140" rx="10" class="plan"/>
  <text x="416" y="427" text-anchor="middle" class="t-chip">plan — task tree</text>
  <line x1="332" y1="437" x2="500" y2="437" class="hair"/>
  <rect x="332" y="448" width="168" height="26" rx="6" class="chip"/>
  <text x="416" y="465.5" text-anchor="middle" class="t-chip">task</text>
  <rect x="332" y="482" width="168" height="26" rx="6" class="chip"/>
  <text x="416" y="499.5" text-anchor="middle" class="t-chip">task′</text>
  <rect x="332" y="516" width="168" height="26" rx="6" class="chip"/>
  <text x="416" y="533.5" text-anchor="middle" class="t-chip">⋯</text>

  <path d="M 416 404 L 416 332" class="e-pin" marker-end="url(#ah-ink)"/>
  <text x="426" y="372" class="lbl">pins vN</text>

  <rect x="596" y="452" width="180" height="48" rx="9" class="codebox"/>
  <text x="686" y="481" text-anchor="middle" class="t-box">code</text>
  <path d="M 596 476 C 558 476, 546 493, 505 495" class="e-ref" marker-end="url(#ah-ink)"/>
  <text x="549" y="466" text-anchor="middle" class="lbl">evidence links</text>

  <!-- ═══ III · LIVE ═══ -->
  <text x="876" y="439" class="phase"><tspan class="n">III — LIVE</tspan>  ·  PRESSURE RETURNS</text>
  <path d="M 776 476 L 872 476" class="e-ref" marker-end="url(#ah-ink)"/>
  <text x="824" y="466" text-anchor="middle" class="lbl">ships</text>
  <rect x="876" y="452" width="200" height="48" rx="9" class="prod"/>
  <text x="976" y="481" text-anchor="middle" class="t-prod">production</text>
  <path d="M 1076 470 C 1158 446, 1164 314, 782 302" class="e-ret" marker-end="url(#ah-ember)"/>

  <!-- legend -->
  <line x1="56" y1="470" x2="86" y2="470" class="e-ref" marker-end="url(#ah-ink)"/>
  <text x="98" y="474" class="legend">reference · verified</text>
  <line x1="56" y1="496" x2="86" y2="496" class="e-press" marker-end="url(#ah-ember)"/>
  <text x="98" y="500" class="legend">pressure</text>
  <line x1="56" y1="522" x2="86" y2="522" class="e-ans" marker-end="url(#ah-ember)"/>
  <text x="98" y="526" class="legend">answer to pressure</text>

  <!-- thesis -->
  <text x="600" y="606" text-anchor="middle" class="thesis">Nothing is retyped — so every drift has exactly one place it can surface.</text>
</svg>
