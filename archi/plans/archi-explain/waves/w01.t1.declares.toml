# `t1` accounts for its work here: for every symbol it changed, what
# that code answers and the test that proves it. One entry closes the
# wave; what the file holds is the writer's to decide.
#
# Nobody types this file. The verb writes it, and it resolves all three
# names before it writes:
#
#   archi plan task t1 link add --symbol "<file>#<symbol>" --answers "<node, port or req:slug>" --proved-by "<test file>#<test fn>"
#
# Each entry lands as one table of this shape:
#
#   [[declares]]
#   symbol = "<file>#<symbol>"
#   answers = "<node, port or req:slug>"
#   proved_by = "<test file>#<test fn>"

[[declares]]
symbol = "crates/archi/src/main.rs#run_decision_ls"
answers = "req:one-verb-lists-the-decisions-on-an-element"
proved_by = "crates/archi/tests/mint_e2e.rs#the_decision_listing_prints_one_row_per_decision_file"

[[declares]]
symbol = "crates/archi/src/docs/mod.rs#serve_decisions"
answers = "DocsCompiler"
proved_by = "crates/archi/tests/mint_e2e.rs#decision_json_carries_the_same_rows_as_the_render"

[[declares]]
symbol = "crates/archi/tests/mint_e2e.rs#listing_project"
answers = "req:one-verb-lists-the-decisions-on-an-element"
proved_by = "crates/archi/tests/mint_e2e.rs#links_refuses_a_name_that_is_neither_element_nor_record"
