[package]
name = "modeling-lang"
version = "0.2.0"
edition = "2024"
description = "Archiplan modeling language: a free graph of nodes, ports and distinguished edges, edited through atomic batches of idempotent JSON statements, and queried back as replayable statements."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
