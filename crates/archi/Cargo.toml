[package]
name = "archi"
version = "0.1.12"
edition = "2024"
license = "MIT"
description = "Thin CLI runner for Archiplan modeling-language statement batches."

[dependencies]
modeling-lang = { path = "../modeling-lang" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
libc = "0.2"
diffy = "0.4"
ascii-dag = "0.9"
